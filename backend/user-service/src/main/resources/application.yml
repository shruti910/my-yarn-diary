spring:
  profiles:
    active: local
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true

internal:
  jwt:
    secret: ${INTERNAL_JWT_SECRET}

crochet-service:
  url: ${CROCHET_SERVICE_URL:http://crochet-service:8082}
  delete-user-endpoint: ${CROCHET_SERVICE_DELETE_USER_ENDPOINT:/api/v1/projects/user}

ai-service:
  url: ${AI_SERVICE_URL:http://ai-service:8083}
  delete-user-endpoint: ${AI_SERVICE_DELETE_USER_ENDPOINT:/api/v1/chats/user}

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  include-application-name: true
  structured:
    format:
      console: logstash
management:
  tracing:
    sampling:
      probability: 1.0 # Trace 100% of requests for development and monitoring purposes
  endpoints:
    web:
      exposure:
        include: "health"
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
